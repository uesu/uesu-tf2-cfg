// -------
//for default
// -------

// -------
//null-movement
// -------

bind w "+forward"
bind a "+moveleft
bind s "+back"
bind d "+moveright"

bind l "dropitem"
bind u "say_team"
bind q "lastinv"

// -------
//specific class
// -------

//crouch jump script

//bind space +jump
//bind ctrl +duck

// -------
//medic competitive script
// -------

bind "e" "voicemenu 0 0" //the "e" key is used for medic radar
bind "f" "+inspect" //the "f" key is used for uber mask
bind "g" "+taunt" //the "g" key is used for fake uber
bind mouse2 +attack2 //used for uber use

// -------
//all class script
//simply add // to not use it
// -------

// -------
//crouch jump script
// -------

alias +rj "spec_mode;-duck;+cr;alias checkrj +cr";
alias -rj "-cr;checkduck;alias checkrj none";
alias +crouch "-cr;+duck;alias checkduck +duck";
alias -crouch "-duck;checkrj;alias checkduck none";
alias checkduck none;
alias checkrj none;
alias +cr "+jump;+duck";
alias -cr "-duck;-jump";
alias none "";
bind ctrl +crouch;
bind space +rj;

// -------
//quick switch loadout script
// -------

bind "KP_HOME" "load_itempreset 0"
bind "KP_UPARROW" "load_itempreset 1"
bind "KP_PGUP" "load_itempreset 2"
bind "KP_LEFTARROW" "load_itempreset 3"

// -------
//quick class switch
// -------

bind shift "+joinclass"
alias +joinclass "bind 1 scout; bind 2 soldier; bind 3 pyro; bind 4 demoman; bind 5 heavy; bind 6 engineer; bind 7 medic; bind 8 sniper; bind 9 spy"
alias -joinclass "bind "1" "slot1"; bind "2" "slot2"; bind "3" "slot3"; bind "4" "slot4"; bind "5" "slot5"; bind "6" "slot6"; bind "7" "slot7"; bind "8" "slot8"; bind "9" "slot9"
alias scout "join_class scout
alias soldier "join_class soldier
alias pyro "join_class pyro
alias demoman "join_class demoman
alias heavy "join_class heavyweapons
alias engineer "join_class engineer
alias medic "join_class medic
alias sniper "join_class sniper
alias spy "join_class spy

